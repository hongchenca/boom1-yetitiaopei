name: yetitiaopei-console
services:
  console:
    image: yetitiaopei-console:0.5.1
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    restart: unless-stopped
    init: true
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    ports:
      - "127.0.0.1:${YETI_PORT:-18080}:8000"
    environment:
      APP_HOST: 0.0.0.0
      APP_PORT: "8000"
      APP_BASE_PATH: /console
      APP_SECURE_COOKIE: "1"
      APP_DATA_DIR: /data
    volumes:
      - console-data:/data
    tmpfs:
      - /tmp:size=32m,mode=1777
    healthcheck:
      test: [CMD, node, deploy/manage.cjs, check]
      interval: 30s
      timeout: 10s
      start_period: 20s
      retries: 3
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"
volumes:
  console-data:
